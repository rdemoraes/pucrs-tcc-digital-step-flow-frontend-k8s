apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-step-flow-frontend
  namespace: digital-step-flow
  labels:
    app: digital-step-flow-frontend
    app.kubernetes.io/component: frontend
  annotations:
    checkov.io/skip: CKV_K8S_43:Image digest not practical with Kustomize dynamic tags;CKV2_K8S_6:NetworkPolicy not implemented yet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digital-step-flow-frontend
  template:
    metadata:
      labels:
        app: digital-step-flow-frontend
        app.kubernetes.io/component: frontend
      annotations:
        container.apparmor.security.beta.kubernetes.io/frontend: runtime/default
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        # checkov:skip=CKV_K8S_43: Image digest not practical with Kustomize dynamic image tags
        # Image tag will be overridden by dev/prod overlays
        image: raphaelmoraes/digital-step-flow-frontend:0.0.1
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        - containerPort: 3001
          name: health
          protocol: TCP
        - containerPort: 3002
          name: metrics
          protocol: TCP
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        startupProbe:
          httpGet:
            path: /health
            port: health
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: health
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /health
            port: health
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: tmp
        emptyDir: {}

