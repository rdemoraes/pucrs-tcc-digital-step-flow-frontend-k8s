apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: development
data:
  nginx.conf: |
    # User is set via securityContext.runAsUser in deployment
    worker_processes auto;
    # Log to stderr (container logs)
    error_log /dev/stderr warn;
    # PID file in /tmp (already mounted as tmpfs)
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        # Log to stdout (container logs)
        access_log /dev/stdout main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

        # Main application server (port 3000)
        server {
            listen 3000;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;

            # SPA routing
            location / {
                try_files $uri $uri/ /index.html;
            }

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Health check server (port 3001)
        server {
            listen 3001;
            server_name _;

            access_log off;

            location /health {
                add_header Content-Type application/json;
                return 200 '{"status":"healthy","service":"frontend"}';
            }

            location / {
                return 404;
            }
        }

        # Metrics server (port 3002)
        server {
            listen 3002;
            server_name _;

            access_log off;

            location /metrics {
                add_header Content-Type text/plain;
                # Basic metrics for static frontend served by Nginx
                # Note: For detailed RPS, request counts, and connection metrics,
                # consider using nginx-prometheus-exporter sidecar or nginx-module-vts
                return 200 '# HELP nginx_up Whether nginx is up (1) or down (0)
# TYPE nginx_up gauge
nginx_up 1
# HELP frontend_service_info Frontend service information
# TYPE frontend_service_info gauge
frontend_service_info{service="digital-step-flow-frontend"} 1
# HELP frontend_build_info Frontend build information
# TYPE frontend_build_info gauge
frontend_build_info{service="digital-step-flow-frontend"} 1
# HELP nginx_http_requests_total Total number of HTTP requests (static - use exporter for real-time)
# TYPE nginx_http_requests_total counter
nginx_http_requests_total{status="200"} 0
nginx_http_requests_total{status="404"} 0
nginx_http_requests_total{status="500"} 0
# HELP nginx_http_request_duration_seconds HTTP request duration in seconds (static - use exporter for real-time)
# TYPE nginx_http_request_duration_seconds histogram
nginx_http_request_duration_seconds_bucket{le="0.005"} 0
nginx_http_request_duration_seconds_bucket{le="0.01"} 0
nginx_http_request_duration_seconds_bucket{le="0.025"} 0
nginx_http_request_duration_seconds_bucket{le="0.05"} 0
nginx_http_request_duration_seconds_bucket{le="0.1"} 0
nginx_http_request_duration_seconds_bucket{le="0.25"} 0
nginx_http_request_duration_seconds_bucket{le="0.5"} 0
nginx_http_request_duration_seconds_bucket{le="1"} 0
nginx_http_request_duration_seconds_bucket{le="2.5"} 0
nginx_http_request_duration_seconds_bucket{le="5"} 0
nginx_http_request_duration_seconds_bucket{le="10"} 0
nginx_http_request_duration_seconds_bucket{le="+Inf"} 0
nginx_http_request_duration_seconds_count 0
nginx_http_request_duration_seconds_sum 0
';
            }

            location / {
                return 404;
            }
        }
    }

