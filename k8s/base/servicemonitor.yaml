apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: digital-step-flow-frontend
  namespace: digital-step-flow
  labels:
    app: digital-step-flow-frontend
    app.kubernetes.io/component: frontend
spec:
  selector:
    matchLabels:
      app: digital-step-flow-frontend
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
