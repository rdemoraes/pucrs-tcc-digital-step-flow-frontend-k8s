apiVersion: v1
kind: Service
metadata:
  name: digital-step-flow-frontend
  namespace: digital-step-flow
  labels:
    app: digital-step-flow-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: health
  - port: 3002
    targetPort: 3002
    protocol: TCP
    name: metrics
  selector:
    app: digital-step-flow-frontend

